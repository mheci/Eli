---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: eli
# description will be included in the image's metadata
description: Personal Fedora Kinoite image with NVIDIA open drivers and dev tooling.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/blue-build/base-images/fedora-kinoite-nvidia-open
image-version: latest # You can pin to a specific version of Fedora as well

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: script
    snippets:
      # Terra's repo has repo_gpgcheck=1, so the key must be in the rpmdb before dnf reads it
      - curl -fsSL "https://repos.fyralabs.com/terra$(rpm -E %fedora)/key.asc" | rpm --import -

  - type: dnf
    repos:
      files:
        - https://raw.githubusercontent.com/terrapkg/subatomic-repos/main/terra.repo
      # Bazzite's setup: negativo17 provides the 32-bit libfdk-aac that Steam needs
      nonfree: negativo17
    install:
      exclude:
        - azure-cli # t3code suggests these; both are too heavy to pull implicitly
        - glab
      packages:
        # Fedora packages Terra doesn't carry
        - nodejs
        - npm
        - git
        - gh
        - jq
        - unzip # extracts the RNNoise release zip
        - libatomic # Hermes' managed Node links this
        - android-tools # adb and fastboot for the Android Studio recipe
        - qemu-kvm # /dev/kvm and the kvm group for the emulator
        - uv
        - mpv
        - yt-dlp
        - kitty
        - btop
        - gdu
        - nvtop
        - kde-connect
        - kdeconnectd
        - qbittorrent
        - wireshark
        # Terra packages
        - zed
        - ghostty
        - bun-bin
        - deno
        - mise
        - faugus-launcher
        - t3code
        # Steam needs the 32-bit libfdk-aac; the base only ships the 64-bit one
        - libfdk-aac.i686
        # opencode.ai's own "latest" endpoint; GitHub's latest tag still points at 1.x
        - https://opencode.ai/update/api/latest/desktop/opencode/opencode-desktop-linux-x86_64.rpm

  - type: dnf
    repos:
      nonfree: rpmfusion
    install:
      install-weak-deps: false # matches Bazzite's Steam install
      packages:
        - steam

  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install:
          # no current native package; Unity's own RPM repo is stuck on 3.15.2
          - com.unity.UnityHub
      - scope: user # Also add Flathub user repo, but no user packages

  - type: justfiles
    validate: true
    install: true

  - type: script
    scripts:
      - install-extra-tools.sh
    snippets:
      - npm install -g @anthropic-ai/claude-code @openai/codex
      - claude --version && codex --version # fail the build if the CLIs are not on PATH

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
